name: Update Organization Profile README

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 */6 * * *' # Run every 6 hours
  workflow_dispatch: # Allow manual 1-click trigger

permissions:
  contents: write

jobs:
  update-profile-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Execute Update Script
        env:
          ORG_PROFILE_TOKEN: ${{ secrets.ORG_PROFILE_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f scripts/update_readme.py ]; then
            python scripts/update_readme.py
          elif [ -f .github/scripts/update_readme.py ]; then
            python .github/scripts/update_readme.py
          fi

      - name: Commit and Push Changes
        run: |
          git config --global user.name "healthy-autopilot[bot]"
          git config --global user.email "healthy-autopilot[bot]@users.noreply.github.com"
          git add .
          if ! git diff-index --quiet HEAD --; then
            git commit -m "chore: dynamically update organization profile statistics [skip ci]"
            git push
          else
            echo "No changes in statistics since last update."
          fi
